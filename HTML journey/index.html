<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Comic Sans MS", cursive, sans-serif;
}

body {
  min-height: 100vh;
  background: #fde7ef;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

/* CARD */
.card {
  background: #fff;
  width: 360px;
  max-width: 90%;
  padding: 22px;
  border-radius: 26px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.2);
  text-align: center;
  position: relative;
  z-index: 2;
}

/* IMAGE */
.image-box {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  height: 210px;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.25s ease;
}

/* CAPTION */
.caption {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.65);
  color: white;
  padding: 6px 16px;
  font-size: 13px;
  border-radius: 999px;
}

/* TEXT */
h1 {
  margin: 26px 0;
  color: #e83e8c;
  font-size: 26px;
  line-height: 1.25;
}

/* BUTTONS */
.buttons {
  position: relative;
  height: 120px;
  margin-top: 10px;
}

button {
  border: none;
  padding: 14px 26px;
  border-radius: 999px;
  font-size: 15px;
  cursor: pointer;
  transition:
    box-shadow 0.15s ease,
    filter 0.15s ease,
    transform 0.25s ease;
}

button:hover {
  box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  filter: brightness(1.05);
}

/* YES */
.yes {
  background: #4cd964;
  color: white;
  position: absolute;
  left: 50%;
  transform: translateX(-115%) scale(1);
  z-index: 3;
}

/* NO */
.no {
  background: #ff6b6b;
  color: white;
  position: absolute;
  left: 50%;
  transform: translateX(15%) scale(1);
  z-index: 4;
}
</style>
</head>

<body>

<div class="card" id="card">
  <div class="image-box">
    <img id="mainImage" src="valentine.jpg" alt="Valentine">
    <span class="caption" id="caption">Please</span>
  </div>

  <h1>
    Baby Kaina,<br>
    will you be my<br>
    Valentine? 🌹
  </h1>

  <div class="buttons">
    <button class="yes">Yes 🥰</button>
    <button class="no">No 😔</button>
  </div>
</div>

<!-- 🔊 SAD SOUND ONLY -->
<audio id="noSound" src="44cdc6da-ad50-4bed-a879-e3e55e7a3e8d.mp3" preload="auto"></audio>

<script>
const noBtn = document.querySelector(".no");
const yesBtn = document.querySelector(".yes");
const img = document.getElementById("mainImage");
const card = document.getElementById("card");
const caption = document.getElementById("caption");
const noSound = document.getElementById("noSound");

const noScales  = [1, 1.08, 1.16, 1.24, 1.32];
const yesScales = [1, 3, 5, 7, 9, 11];

const captions = [
  "Please",
  "Why did you click no?",
  "Baby T_T",
  "You want me dead huh?",
  "I am dead na",
  "Really?"
];

let stage = 0;

/* YES → redirect only (no sound here) */
yesBtn.addEventListener("click", () => {
  setTimeout(() => {
    window.location.href = "yes.html";
  }, 300);
});

/* NO */
noBtn.addEventListener("click", () => {
  noSound.currentTime = 0.5;
  noSound.play();

  if (stage <= 4) {
    moveNoNearCard();
    growNo();
    growYes();
  }

  if (stage === 0) {
    stage = 1;
    changeImage("crying-cat.png");
    noBtn.textContent = "Are you sure? 😭";
  }
  else if (stage === 1) {
    stage = 2;
    changeImage("pepe-crying.png");
    noBtn.textContent = "Ngano no giapon? 😭";
  }
  else if (stage === 2) {
    stage = 3;
    changeImage("dead-kermit.jpg");
    noBtn.textContent = "I am dead na :<";
  }
  else if (stage === 3) {
    stage = 4;
    changeImage("carrying-coffin.jpg");
    noBtn.textContent = "They are carrying me na ⚰️";
  }
  else if (stage === 4) {
    stage = 5;
    changeImage("coffin-working.jpg");
    noBtn.remove();

    yesBtn.textContent = "Yes 🥰";
    yesBtn.style.left = "50%";
    yesBtn.style.transform =
      `translateX(-50%) scale(${yesScales[5]})`;
  }

  caption.textContent = captions[stage];
});

/* helpers */
function growNo() {
  const scale = noScales[Math.min(stage + 1, noScales.length - 1)];
  noBtn.style.transform = `scale(${scale})`;
}

function growYes() {
  const scale = yesScales[Math.min(stage + 1, yesScales.length - 1)];
  yesBtn.style.transform =
    `translateX(-50%) scale(${scale})`;
}

function moveNoNearCard() {
  const cardRect = card.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();
  const gap = 16;
  const offset = Math.random() * 30 - 15;
  const sides = ["top", "bottom", "left", "right"];
  const side = sides[Math.floor(Math.random() * sides.length)];

  let x, y;

  if (side === "top") {
    x = cardRect.left + cardRect.width / 2 - btnRect.width / 2 + offset;
    y = cardRect.top - btnRect.height - gap;
  } else if (side === "bottom") {
    x = cardRect.left + cardRect.width / 2 - btnRect.width / 2 + offset;
    y = cardRect.bottom + gap;
  } else if (side === "left") {
    x = cardRect.left - btnRect.width - gap;
    y = cardRect.top + cardRect.height / 2 - btnRect.height / 2 + offset;
  } else {
    x = cardRect.right + gap;
    y = cardRect.top + cardRect.height / 2 - btnRect.height / 2 + offset;
  }

  noBtn.style.position = "fixed";
  noBtn.style.left = `${Math.max(8, x)}px`;
  noBtn.style.top = `${Math.max(8, y)}px`;
}

function changeImage(src) {
  const preload = new Image();
  preload.src = src;
  preload.onload = () => {
    img.style.opacity = 0;
    setTimeout(() => {
      img.src = src;
      img.style.opacity = 1;
    }, 120);
  };
}
</script>

</body>
</html>
