<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>It’s a Date 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Comic Sans MS", cursive, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fde7ef;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: #fff;
  width: 360px;
  max-width: 90%;
  padding: 24px;
  border-radius: 26px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.2);
  text-align: center;
}

h1 {
  color: #e83e8c;
  margin-bottom: 6px;
}

.hearts {
  font-size: 26px;
  margin-bottom: 8px;
}

.summary {
  background: #ffe6ef;
  border-radius: 16px;
  padding: 16px;
  margin: 18px 0;
  text-align: left;
}

.summary p {
  margin: 10px 0;
  font-size: 14px;
}

.label {
  font-weight: bold;
  color: #d6336c;
}

.footer {
  margin-top: 14px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="hearts">💖👩‍❤️‍👨💖</div>
  <h1>It’s a Date, My Baby Kaina!</h1>

  <div class="summary">
    <p><span class="label">When:</span> <span id="when"></span></p>
    <p><span class="label">Food:</span> <span id="food"></span></p>
    <p><span class="label">Extras:</span> <span id="extras"></span></p>
  </div>

  <div class="footer">
    I love you! See you then! 😘
  </div>

</div>

<!-- 🎵 HAPPY SOUND -->
<audio id="happySound" src="Files/492a1f26-6546-45a0-9bfe-b60bb30d674b.mp3" preload="auto"></audio>

<script>
/* PLAY HAPPY SOUND ON LOAD */
window.addEventListener("load", () => {
  const happySound = document.getElementById("happySound");
  happySound.currentTime = 0;
  happySound.play().catch(() => {});
});

/* READ DATA */
const rawDate = localStorage.getItem("date") || "";
const foods = JSON.parse(localStorage.getItem("foods") || "[]");
const extras = JSON.parse(localStorage.getItem("extras") || "[]");

/* FORMAT DATE */
let whenText = "—";
if (rawDate === "14") whenText = "February 14, 2026";
if (rawDate === "15") whenText = "February 15, 2026";

/* APPLY */
document.getElementById("when").textContent = whenText;
document.getElementById("food").textContent =
  foods.length ? foods.join(", ") : "Surprise 😋";
document.getElementById("extras").textContent =
  extras.length ? extras.join(", ") : "Just us 💕";
</script>

</body>
</html>
